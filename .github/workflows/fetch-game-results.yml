name: Fetch Next Game Results

on:
  schedule:
    # GitHub Actions mínimo: 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-game:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch next game from API
        run: node tools/fetch-next-game.js

      - name: Check for changes
        id: check-changes
        run: |
          if git diff-index --quiet HEAD; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git add data/resultados.json data/next-game-id.json
          git commit -m "[AUTO] Atualizar resultado dos jogos"
          git push

      - name: Log summary
        run: |
          echo "✅ Verificação completa"
